name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lua 5.1
        run: |
          set -euo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.1.5.tar.gz -o "$RUNNER_TEMP/lua-5.1.5.tar.gz"
          tar -xzf "$RUNNER_TEMP/lua-5.1.5.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5" -j4 generic
          mkdir -p "$RUNNER_TEMP/lua/bin"
          cp "$RUNNER_TEMP/lua-5.1.5/src/lua" "$RUNNER_TEMP/lua-5.1.5/src/luac" "$RUNNER_TEMP/lua/bin/"
          echo "$RUNNER_TEMP/lua/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lua/bin/luac" -v

      - name: Verify metadata and sources
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME.TrimStart('v').Trim()
            ./build.ps1 -Version $version -VerifyOnly -NoZip
          }
          else {
            ./build.ps1 -VerifyOnly -NoZip
          }

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Lua 5.1
        run: |
          set -euo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.1.5.tar.gz -o "$RUNNER_TEMP/lua-5.1.5.tar.gz"
          tar -xzf "$RUNNER_TEMP/lua-5.1.5.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/lua-5.1.5" -j4 generic
          mkdir -p "$RUNNER_TEMP/lua/bin"
          cp "$RUNNER_TEMP/lua-5.1.5/src/lua" "$RUNNER_TEMP/lua-5.1.5/src/luac" "$RUNNER_TEMP/lua/bin/"
          echo "$RUNNER_TEMP/lua/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lua/bin/luac" -v

      - name: Verify tag and build the zip
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v').Trim()
          if ($version -ne $env:TAG_NAME) { Write-Host "tag: $env:TAG_NAME -> version: $version" }
          ./build.ps1 -Version $version -VerifyOnly `
            -OutputPath "$env:RUNNER_TEMP/dist" `
            -ReleaseNotesPath "$env:RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: I remember you! ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ runner.temp }}/dist/IRememberYou-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
